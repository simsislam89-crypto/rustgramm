[workspace]
resolver = "2"
members = ["crates/rg-net", "crates/rg-settings", "crates/rg-core", "crates/rg-ayu", "crates/rg-ui", "crates/rg-desktop", "crates/rg-android"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
