[package]
name = "rg-desktop"
description = "Rustgramm desktop client (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rg-core = { path = "../rg-core" }
rg-ayu = { path = "../rg-ayu" }
rg-settings = { path = "../rg-settings" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
grammers-client = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
grammers-session = "0.12"
