[package]
name = "rg-core"
description = "Rustgramm core: Telegram MTProto client over the rg-net guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rg-net = { path = "../rg-net" }
grammers-mtsender = { version = "0.12", features = ["proxy"] }
grammers-session = "0.12"
grammers-client = "0.12"
grammers-crypto = "0.12"
num-bigint = "0.5"
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
rg-settings = { path = "../rg-settings" }
rg-ayu = { path = "../rg-ayu" }
serde = { workspace = true }

[dev-dependencies]
rpassword = "7"
