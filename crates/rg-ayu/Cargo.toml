[package]
name = "rg-ayu"
description = "Rustgramm: ghost mode request policy and local deleted/edited message store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rg-settings = { path = "../rg-settings" }
grammers-tl-types = "0.12"
regex = "1"
libsql = { version = "0.10", default-features = false, features = ["core"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
