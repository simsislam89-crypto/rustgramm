[package]
name = "rg-ui"
description = "Rustgramm shared UI (desktop and Android), Telegram-like look with orange accent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
rg-core = { path = "../rg-core" }
rg-ayu = { path = "../rg-ayu" }
rg-settings = { path = "../rg-settings" }
eframe = { version = "0.37", default-features = false, features = ["glow"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
grammers-client = "0.12"
grammers-session = "0.12"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.15", default-features = false }
