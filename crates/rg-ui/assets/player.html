<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px "Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;outline:none}
body.idle{cursor:none}
#bar{position:fixed;left:12px;right:12px;bottom:12px;height:46px;border-radius:12px;background:rgba(14,14,14,.74);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:4px;padding:0 8px;
  transition:opacity .2s,transform .2s;box-sizing:border-box}
body.idle #bar{opacity:0;transform:translateY(6px);pointer-events:none}
.b{width:34px;height:34px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.82;flex:none;padding:0}
.b:hover{opacity:1;background:rgba(255,255,255,.1)}
.b img{width:24px;height:24px;pointer-events:none}
#t{font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap;margin:0 8px 0 2px;flex:none;font-size:12px}
.sl{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;flex:1;min-width:40px}
.sl i{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:height .1s}
.sl:hover i{height:5px}
.sl u{position:absolute;left:0;height:3px;border-radius:2px;background:#F58220;text-decoration:none;pointer-events:none;transition:height .1s}
.sl:hover u{height:5px}
.sl s{position:absolute;left:0;height:3px;border-radius:2px;background:rgba(255,255,255,.28);text-decoration:none;pointer-events:none}
#vol{flex:none;width:72px;margin-right:6px}
#sp{width:auto;min-width:42px;padding:0 8px;color:#fff;font:12px "Segoe UI",sans-serif}
#spm{position:fixed;bottom:66px;background:rgba(14,14,14,.92);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:4px;display:none}
#spm div{padding:6px 18px;border-radius:6px;cursor:pointer;font-size:13px;text-align:center}
#spm div:hover{background:rgba(255,255,255,.12)}
#spm div.on{font-weight:700;color:#F58220}
#big{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:32px;background:rgba(14,14,14,.6);display:none;align-items:center;justify-content:center;pointer-events:none}
#big img{width:36px;height:36px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
</style></head><body>
<video id="v" src="{SRC}" autoplay {LOOP} playsinline></video>
<div id="big"><img src="i/play.png"></div>
<div id="err">Не удалось воспроизвести</div>
<div id="bar">
  <button class="b" id="pp"><img id="ppi" src="i/pause.png"></button>
  <span id="t">0:00 / 0:00</span>
  <div class="sl" id="seek"><i></i><s id="buf"></s><u id="pos"></u></div>
  <button class="b" id="mu"><img id="mui" src="i/vol_on.png"></button>
  <div class="sl" id="vol"><i></i><u id="vpos"></u></div>
  <button class="b" id="sp">1×</button>
  <button class="b" id="pip" title="Картинка в картинке"><img src="i/pip.png"></button>
  <button class="b" id="fs" title="На весь экран (F)"><img src="i/fullscreen.png"></button>
</div>
<div id="spm"></div>
<script>
var v=document.getElementById('v'),$=function(i){return document.getElementById(i)};
var __n=0;
// Сообщения программе идут через заголовок страницы: IPC wry не принимает адреса file:///.
function post(m){document.title='rg'+(++__n)+'|'+m}
function fmt(s){s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;
  return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+c).slice(-2)}
function upd(){var d=v.duration||0;$('t').textContent=fmt(v.currentTime)+' / '+fmt(d);
  $('pos').style.width=(d?v.currentTime/d*100:0)+'%';
  if(v.buffered.length&&d){$('buf').style.width=(v.buffered.end(v.buffered.length-1)/d*100)+'%'}}
function icons(){$('ppi').src=v.paused?'i/play.png':'i/pause.png';$('big').style.display=v.paused&&v.currentTime>0?'flex':'none';
  $('mui').src=(v.muted||v.volume===0)?'i/vol_off.png':'i/vol_on.png';$('vpos').style.width=(v.muted?0:v.volume*100)+'%'}
v.addEventListener('timeupdate',upd);v.addEventListener('progress',upd);v.addEventListener('durationchange',upd);
['play','pause','volumechange'].forEach(function(e){v.addEventListener(e,icons)});
var sent=false;
function size(){if(!sent&&v.videoWidth>0){sent=true;post('size:'+v.videoWidth+':'+v.videoHeight)}upd();icons()}
['loadedmetadata','loadeddata','resize','canplay','playing'].forEach(function(e){v.addEventListener(e,size)});
if(v.readyState>=1){size()}
var poll=setInterval(function(){size();if(sent)clearInterval(poll)},150);
v.addEventListener('error',function(){$('err').style.display='flex'});
function toggle(){v.paused?v.play():v.pause()}
$('pp').onclick=toggle;v.onclick=toggle;
$('mu').onclick=function(){v.muted=!v.muted;icons()};
function drag(el,fn){var on=false;function at(e){var r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)))}
  el.addEventListener('pointerdown',function(e){on=true;el.setPointerCapture(e.pointerId);at(e)});
  el.addEventListener('pointermove',function(e){if(on)at(e)});
  el.addEventListener('pointerup',function(e){on=false;el.releasePointerCapture(e.pointerId)})}
drag($('seek'),function(f){if(v.duration)v.currentTime=f*v.duration});
drag($('vol'),function(f){v.muted=false;v.volume=f;icons()});
var rates=[0.5,0.75,1,1.25,1.5,2],m=$('spm');
rates.forEach(function(r){var d=document.createElement('div');d.textContent=r+'×';d.onclick=function(e){e.stopPropagation();v.playbackRate=r;$('sp').textContent=r+'×';
  Array.prototype.forEach.call(m.children,function(c){c.className=c===d?'on':''});m.style.display='none'};if(r===1)d.className='on';m.appendChild(d)});
$('sp').onclick=function(e){e.stopPropagation();var r=$('sp').getBoundingClientRect();m.style.left=(r.left+r.width/2-40)+'px';m.style.display=m.style.display==='block'?'none':'block'};
document.addEventListener('click',function(){m.style.display='none'});
$('pip').onclick=function(){if(document.pictureInPictureElement){document.exitPictureInPicture()}else if(document.pictureInPictureEnabled){v.requestPictureInPicture().catch(function(){})}};
var full=false;function fs(){full=!full;post('fs:'+(full?1:0))}
$('fs').onclick=fs;v.ondblclick=fs;
document.addEventListener('keydown',function(e){
  if(e.code==='Escape'){if(full){fs()}else{post('close')}}
  else if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='ArrowRight'){v.currentTime+=5}
  else if(e.code==='ArrowLeft'){v.currentTime-=5}
  else if(e.code==='ArrowUp'){v.volume=Math.min(1,v.volume+.1);icons()}
  else if(e.code==='ArrowDown'){v.volume=Math.max(0,v.volume-.1);icons()}
  else if(e.code==='KeyM'){v.muted=!v.muted;icons()}
  else if(e.code==='KeyF'){fs()}});
var idle;function wake(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(function(){if(!v.paused)document.body.classList.add('idle')},2500)}
document.addEventListener('mousemove',wake);document.addEventListener('keydown',wake);wake();
v.addEventListener('pause',wake);icons();upd();
</script></body></html>
