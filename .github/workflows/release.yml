name: Release (PC & Android Full/Lite)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-pc:
    name: Windows PC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy & Tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build Windows Release
        env:
          RG_BUILTIN_API_ID: ${{ secrets.RG_BUILTIN_API_ID }}
          RG_BUILTIN_API_HASH: ${{ secrets.RG_BUILTIN_API_HASH }}
        run: |
          cargo build --release -p rg-desktop
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rg-desktop.exe dist\Rustgramm-Windows-x64.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Rustgramm-Windows-x64
          path: dist/Rustgramm-Windows-x64.exe

  android-apk:
    name: Android (Full with Plugins & Lite without Plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK & cargo-apk
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME}" -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"
          test -f "${ANDROID_HOME}/ndk/26.3.11579264/source.properties"
          cargo install cargo-apk --locked
      - name: Build Android Full (with Plugins) & Lite (without Plugins)
        env:
          RG_BUILTIN_API_ID: ${{ secrets.RG_BUILTIN_API_ID }}
          RG_BUILTIN_API_HASH: ${{ secrets.RG_BUILTIN_API_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/26.3.11579264"
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          export NDK_HOME="${ANDROID_NDK_ROOT}"
          bash scripts/make-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rustgramm-Android-APKs
          path: |
            dist/Rustgramm-Android-Full.apk
            dist/Rustgramm-Android-Lite.apk

  publish-release:
    name: Publish Unified GitHub Release (3 Assets)
    needs: [windows-pc, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Unified Release (Windows PC + Android Full & Lite)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Rustgramm ${{ github.ref_name }}"
          make_latest: true
          generate_release_notes: true
          body: |
            Единый релиз Rustgramm ${{ github.ref_name }} (3 файла):
            - `Rustgramm-Windows-x64.exe` — Windows PC (x64)
            - `Rustgramm-Android-Full.apk` — Android (arm64, с плагинами)
            - `Rustgramm-Android-Lite.apk` — Android (arm64, без плагинов)
          files: |
            artifacts/Rustgramm-Windows-x64/Rustgramm-Windows-x64.exe
            artifacts/Rustgramm-Android-APKs/Rustgramm-Android-Full.apk
            artifacts/Rustgramm-Android-APKs/Rustgramm-Android-Lite.apk
      - name: Cleanup Old GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release list -R "$REPO" --limit 200 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" -R "$REPO" --yes --cleanup-tag || true
            fi
          done
