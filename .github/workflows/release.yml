name: Release (PC & Android Full/Lite)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-pc:
    name: Windows PC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy & Tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build Windows Release
        env:
          RG_BUILTIN_API_ID: ${{ secrets.RG_BUILTIN_API_ID }}
          RG_BUILTIN_API_HASH: ${{ secrets.RG_BUILTIN_API_HASH }}
        run: |
          cargo build --release -p rg-desktop
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rg-desktop.exe dist\Rustgramm-Windows-x64.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Rustgramm-Windows-x64
          path: dist/Rustgramm-Windows-x64.exe

  android-apk:
    name: Android (Full with Plugins & Lite without Plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & cargo-apk
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          cargo install cargo-apk --locked
      - name: Build Android Full (with Plugins) & Lite (without Plugins)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          RG_BUILTIN_API_ID: ${{ secrets.RG_BUILTIN_API_ID }}
          RG_BUILTIN_API_HASH: ${{ secrets.RG_BUILTIN_API_HASH }}
        run: |
          bash scripts/make-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rustgramm-Android-APKs
          path: |
            dist/Rustgramm-Android-Full.apk
            dist/Rustgramm-Android-Lite.apk

  publish-release:
    name: Publish GitHub Release
    needs: [windows-pc, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Rustgramm-Windows-x64/Rustgramm-Windows-x64.exe
            artifacts/Rustgramm-Android-APKs/Rustgramm-Android-Full.apk
            artifacts/Rustgramm-Android-APKs/Rustgramm-Android-Lite.apk
